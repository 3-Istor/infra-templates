# =============================================================================
# EXEMPLE: Frontend (React/Vue/Angular)
# =============================================================================

replicaCount: 2

image:
  repository: mycompany/frontend-app
  pullPolicy: IfNotPresent
  tag: "2.5.1"

service:
  enabled: true
  type: ClusterIP
  ports:
    - name: http
      port: 80
      targetPort: 3000
      protocol: TCP

ingress:
  enabled: true
  className: nginx
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
  hosts:
    - host: app.example.com
      paths:
        - path: /
          pathType: Prefix
          portName: http
  tls:
    - secretName: frontend-tls
      hosts:
        - app.example.com

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 128Mi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 80

livenessProbe:
  enabled: true
  httpGet:
    path: /
    port: http
  initialDelaySeconds: 10
  periodSeconds: 10

readinessProbe:
  enabled: true
  httpGet:
    path: /
    port: http
  initialDelaySeconds: 5
  periodSeconds: 5

env:
  - name: REACT_APP_API_URL
    value: "https://api.example.com"
  - name: REACT_APP_ENV
    value: "production"

configMap:
  enabled: true
  data:
    env.js: |
      window.ENV = {
        API_URL: 'https://api.example.com',
        ANALYTICS_ID: 'UA-123456-1'
      };

commonLabels:
  environment: production
  team: frontend
  managed-by: terraform
