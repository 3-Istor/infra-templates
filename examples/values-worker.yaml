# =============================================================================
# EXEMPLE: Worker/Background Job (Python/Celery)
# =============================================================================

replicaCount: 5

image:
  repository: mycompany/worker
  pullPolicy: IfNotPresent
  tag: "1.0.0"

serviceAccount:
  create: true
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::123456789:role/worker-role

# Pas de service pour un worker
service:
  enabled: false

# Pas d'ingress pour un worker
ingress:
  enabled: false

resources:
  limits:
    cpu: 2000m
    memory: 4Gi
  requests:
    cpu: 1000m
    memory: 2Gi

autoscaling:
  enabled: true
  minReplicas: 5
  maxReplicas: 50
  targetCPUUtilizationPercentage: 75
  targetMemoryUtilizationPercentage: 85

# Probes adaptées pour un worker (pas de HTTP)
livenessProbe:
  enabled: true
  exec:
    command:
      - python
      - /app/healthcheck.py
  initialDelaySeconds: 60
  periodSeconds: 30
  timeoutSeconds: 10
  failureThreshold: 3

readinessProbe:
  enabled: true
  exec:
    command:
      - python
      - /app/readiness.py
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

env:
  - name: WORKER_TYPE
    value: "celery"
  - name: CELERY_BROKER_URL
    valueFrom:
      secretKeyRef:
        name: generic-app-worker
        key: broker-url
  - name: CELERY_RESULT_BACKEND
    valueFrom:
      secretKeyRef:
        name: generic-app-worker
        key: result-backend
  - name: LOG_LEVEL
    value: "INFO"
  - name: WORKER_CONCURRENCY
    value: "4"

configMap:
  enabled: true
  data:
    celeryconfig.py: |
      broker_url = os.environ.get('CELERY_BROKER_URL')
      result_backend = os.environ.get('CELERY_RESULT_BACKEND')
      task_serializer = 'json'
      accept_content = ['json']
      result_serializer = 'json'
      timezone = 'UTC'
      enable_utc = True

secret:
  enabled: true
  type: Opaque
  data:
    broker-url: "redis://redis.example.com:6379/0"
    result-backend: "redis://redis.example.com:6379/1"

volumeMounts:
  - name: config
    mountPath: /app/config
    readOnly: true

volumes:
  - name: config
    configMap:
      name: generic-app-worker

nodeSelector:
  workload-type: compute-intensive

tolerations:
  - key: "dedicated"
    operator: "Equal"
    value: "workers"
    effect: "NoSchedule"

lifecycle:
  preStop:
    exec:
      command: ["/bin/sh", "-c", "sleep 30"]

commonLabels:
  environment: production
  team: data
  component: worker
  managed-by: terraform
