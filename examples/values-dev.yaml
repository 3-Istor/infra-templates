# =============================================================================
# EXEMPLE: Configuration pour environnement DEV
# =============================================================================

replicaCount: 1

image:
  repository: mycompany/myapp
  pullPolicy: Always  # Toujours pull en dev pour avoir la dernière version
  tag: "dev-latest"

service:
  enabled: true
  type: ClusterIP
  ports:
    - name: http
      port: 80
      targetPort: 8080

ingress:
  enabled: true
  className: nginx
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-staging  # Staging en dev
  hosts:
    - host: app-dev.example.com
      paths:
        - path: /
          pathType: Prefix
          portName: http
  tls:
    - secretName: app-dev-tls
      hosts:
        - app-dev.example.com

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 128Mi

# Pas d'autoscaling en dev
autoscaling:
  enabled: false

livenessProbe:
  enabled: true
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 10
  periodSeconds: 30

readinessProbe:
  enabled: true
  httpGet:
    path: /ready
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10

env:
  - name: ENVIRONMENT
    value: "development"
  - name: LOG_LEVEL
    value: "debug"
  - name: DEBUG
    value: "true"

configMap:
  enabled: true
  data:
    config.json: |
      {
        "features": {
          "newUI": true,
          "betaFeatures": true,
          "debugMode": true
        }
      }

commonLabels:
  environment: development
  managed-by: helm
