# =============================================================================
# Exemple GitLab CI/CD pour déployer avec Helm et Terraform
# =============================================================================

stages:
  - validate
  - test
  - deploy-dev
  - deploy-staging
  - deploy-production

variables:
  HELM_VERSION: "3.13.0"
  TERRAFORM_VERSION: "1.6.0"
  CHART_PATH: "."

# =============================================================================
# Templates
# =============================================================================

.helm_base:
  image: alpine/helm:${HELM_VERSION}
  before_script:
    - helm version

.terraform_base:
  image: hashicorp/terraform:${TERRAFORM_VERSION}
  before_script:
    - terraform version

.kubectl_config:
  before_script:
    - mkdir -p ~/.kube
    - echo "$KUBECONFIG_CONTENT" | base64 -d > ~/.kube/config
    - chmod 600 ~/.kube/config

# =============================================================================
# Validation
# =============================================================================

helm:lint:
  stage: validate
  extends: .helm_base
  script:
    - helm lint ${CHART_PATH}
  only:
    - merge_requests
    - main

helm:template:
  stage: validate
  extends: .helm_base
  script:
    - helm template test-release ${CHART_PATH} -f examples/values-api-backend.yaml
    - helm template test-release ${CHART_PATH} -f examples/values-frontend.yaml
    - helm template test-release ${CHART_PATH} -f examples/values-worker.yaml
  artifacts:
    paths:
      - rendered-*.yaml
    expire_in: 1 day
  only:
    - merge_requests
    - main

terraform:validate:
  stage: validate
  extends: .terraform_base
  script:
    - cd examples
    - terraform init -backend=false
    - terraform validate
  only:
    - merge_requests
    - main

# =============================================================================
# Tests
# =============================================================================

helm:dry-run:
  stage: test
  extends:
    - .helm_base
    - .kubectl_config
  script:
    - helm install test-release ${CHART_PATH} 
      -f examples/values-api-backend.yaml 
      --dry-run --debug
  only:
    - merge_requests
    - main

# =============================================================================
# Déploiement DEV
# =============================================================================

deploy:dev:api:
  stage: deploy-dev
  extends:
    - .helm_base
    - .kubectl_config
  script:
    - helm upgrade --install api-backend ${CHART_PATH}
      -f examples/values-api-backend.yaml
      --set image.tag=${CI_COMMIT_SHORT_SHA}
      --set commonLabels.commit=${CI_COMMIT_SHORT_SHA}
      --namespace dev
      --create-namespace
      --wait
      --timeout 5m
  environment:
    name: dev/api-backend
    url: https://api-dev.example.com
  only:
    - develop

deploy:dev:frontend:
  stage: deploy-dev
  extends:
    - .helm_base
    - .kubectl_config
  script:
    - helm upgrade --install frontend ${CHART_PATH}
      -f examples/values-frontend.yaml
      --set image.tag=${CI_COMMIT_SHORT_SHA}
      --namespace dev
      --create-namespace
      --wait
  environment:
    name: dev/frontend
    url: https://app-dev.example.com
  only:
    - develop

# =============================================================================
# Déploiement STAGING
# =============================================================================

deploy:staging:terraform:
  stage: deploy-staging
  extends: .terraform_base
  script:
    - cd examples
    - terraform init
    - terraform workspace select staging || terraform workspace new staging
    - terraform plan -var="environment=staging" -out=tfplan
    - terraform apply tfplan
  environment:
    name: staging
    url: https://app-staging.example.com
  only:
    - main
  when: manual

# =============================================================================
# Déploiement PRODUCTION
# =============================================================================

deploy:production:terraform:
  stage: deploy-production
  extends: .terraform_base
  script:
    - cd examples
    - terraform init
    - terraform workspace select production || terraform workspace new production
    - terraform plan -var="environment=production" -out=tfplan
    - terraform apply tfplan
  environment:
    name: production
    url: https://app.example.com
  only:
    - tags
  when: manual

deploy:production:api:
  stage: deploy-production
  extends:
    - .helm_base
    - .kubectl_config
  script:
    - |
      helm upgrade --install api-backend ${CHART_PATH} \
        -f examples/values-production.yaml \
        --set image.tag=${CI_COMMIT_TAG} \
        --set commonLabels.version=${CI_COMMIT_TAG} \
        --set commonAnnotations.deployed-at=$(date -u +"%Y-%m-%dT%H:%M:%SZ") \
        --set commonAnnotations.deployed-by=${GITLAB_USER_LOGIN} \
        --set commonAnnotations.pipeline-id=${CI_PIPELINE_ID} \
        --namespace production \
        --create-namespace \
        --wait \
        --timeout 10m \
        --atomic
  environment:
    name: production/api-backend
    url: https://api.example.com
  only:
    - tags
  when: manual

# =============================================================================
# Rollback
# =============================================================================

rollback:production:
  stage: deploy-production
  extends:
    - .helm_base
    - .kubectl_config
  script:
    - helm rollback api-backend --namespace production
  environment:
    name: production/api-backend
  only:
    - tags
  when: manual
