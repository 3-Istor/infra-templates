# =============================================================================
# GENERIC HELM CHART VALUES
# Ce fichier contient toutes les valeurs par défaut pour le chart générique
# =============================================================================

project_name: ""
app_name: ""

# prod or staging. Set by the app's deploy/env/staging/<component>.yaml, never
# for prod: prod renders exactly as it did before environments existed. Staging
# adds the cnp.3istor.com/env label, keeps its database names apart from prod
# and always uses a rolling update.
environment: prod

# -----------------------------------------------------------------------------
# Application Configuration
# -----------------------------------------------------------------------------
nameOverride: ""
fullnameOverride: ""
namespace: dev-sandbox

# Nombre de réplicas (peut être overridé par HPA)
replicaCount: 1

ingress:
  enabled: false
  hostname: ""
  sso_protected: false
  # Groups of the app's realm allowed through, on top of being logged in.
  # Empty keeps today's behaviour: any user of the realm. A project's realm
  # maps its platform members to project-members and project-admins.
  allowedGroups: []
  # Reachable without SSO; Exact unless match: PathPrefix. Items: {path, method?, match?}.
  publicPaths: []

  # Which Gateway this app's HTTPRoute attaches to. Defaults to the shared
  # gateway so existing apps are unaffected; a project that owns its own Gateway
  # (D-05) points this at <project>-system/<project>-gateway.
  gateway:
    name: shared-gateway
    namespace: gateway-infra

  # OIDC provider for the SecurityPolicy. baseURL is the central Keycloak by
  # default; a project running its own Keycloak IAMaaS (D-04) sets issuer to
  # https://auth-<project>.3istor.com/realms/<realm>.
  #
  # Whatever is set here must be the hostname the *browser* sees. Envoy needs a
  # cluster-local resolution path for the same name, not a different name.
  oidc:
    baseURL: https://auth.3istor.com
    issuer: ""      # overrides baseURL + realm when set
    clientID: ""    # defaults to cnp-<project_name>-<app_name>

  # One cloudflared connector per Helm release. Set false once the project owns
  # a single connector in <project>-system (D-06).
  tunnel:
    perRelease: true
    image: cloudflare/cloudflared:2026.10.0@sha256:9b49eed8f62806d5d45ddf59ecefb5710429598ea6d3fcccd2af938f621b2b07

# Vault Secrets Operator Configuration
secrets:
  enabled: false
  vaultPath: ""       # Format: "project-<project_name>/<app_name>"
  vaultRole: ""       # Format: "<project_name>-<app_name>-role"

# One app-registry VaultSecret per namespace: set false on all but one release sharing it (fullstack frontend).
registrySecret:
  create: true

# -----------------------------------------------------------------------------
# Image Configuration
# -----------------------------------------------------------------------------
image:
  repository: ghcr.io/3-istor/template-app-webapp-python-fastapi-react/backend
  pullPolicy: IfNotPresent
  tag: "latest"

imagePullSecrets:
  - name: app-registry

# -----------------------------------------------------------------------------
# Pod Annotations et Labels
# -----------------------------------------------------------------------------
db:
  enabled: false
  name: ""
  storage: "1Gi"

  # local-path is the on-prem storage class and does not exist on AWS or GCP.
  # The per-cluster profile supplies the right one (D-08).
  storageClass: local-path

  # Pinned rather than left to the operator's default, which is frozen into
  # each Cluster when it is created: a new default never reaches existing
  # databases. Same major only; a minor bump is a rolling restart.
  imageName: ghcr.io/cloudnative-pg/postgresql:18.6-202610050823-system-trixie@sha256:3e89ea90485ffda67094fd6950d9d61dec9ec314aabc8d63c048c67759918621

  # A single instance on node-local storage does not survive a node loss, which
  # sits badly next to "an already-deployed application must keep working".
  # Prod should be at least 2 once the cluster can carry it; staging stays at 1.
  instances: 1

  # Off by default: storage is scarce, so a database is backed up only when
  # its owner asks for it, from the CMP or here.
  #
  # The bucket is claimed from the OpenStack Ceph RGW (K3s rook-ceph
  # object-store.yaml) and belongs to this app: it goes away with the app or
  # its project unless keepAfterDelete is true.
  #
  # Note for the day this is turned on together with offhours: offhours-guard
  # targets the app Deployment, not the CNPG Cluster, so a scaled-down staging
  # app leaves its database up and its backup window intact. If the database is
  # ever added to the offhours targets, the ordering has to be specified here
  # rather than discovered project by project — otherwise every night produces
  # failed backups and noisy alerts.
  backup:
    enabled: false
    keepAfterDelete: false
    # Cron with seconds, as CNPG's ScheduledBackup expects.
    schedule: "0 0 3 * * *"
    retentionPolicy: "7d"
    endpointURL: http://192.168.1.110:7480

  # Written by the CMP's restore button, not by hand. Bumping generation
  # creates a new cluster recovered from the backups of sourceServer (the
  # cluster name a backup was taken from) and switches the app to it; Argo CD
  # then removes the previous cluster, whose backups and WAL stay in the
  # bucket so the restore itself can be undone the same way. generation only
  # ever grows: a new cluster refuses a WAL archive that already has data.
  #
  # backupID picks the base backup; without targetTime the database is
  # restored as it was when that backup ended, with it the WAL is replayed up
  # to that instant (RFC 3339).
  restore:
    generation: 0
    sourceServer: ""
    backupID: ""
    targetTime: ""

# -----------------------------------------------------------------------------
# Database migrations (CNP migration standard v1)
# -----------------------------------------------------------------------------
# Runs command from the app image as an Argo CD PreSync Job, so the schema is
# migrated before any new pod starts and a failed migration stops the sync with
# the running version untouched. Migrations must stay compatible with the
# previous release (expand/contract): old and new pods share the database.
migrations:
  enabled: false
  command: []
  # Takes an on-demand CNPG backup first. Only applies with db.backup.enabled:
  # without a bucket there is nothing to back up to.
  backupBefore: true
  # Accepts s, m or h. Becomes the Job's activeDeadlineSeconds.
  timeout: 5m
  # Empty reuses the app's resources.
  resources: {}

# -----------------------------------------------------------------------------
# Progressive delivery (CNP Release)
# -----------------------------------------------------------------------------
# rolling keeps the plain Deployment rollout. canary hands the Deployment's pods
# to an Argo Rollout (workloadRef) that shifts the HTTPRoute weights step by
# step, gated by a smoke test and an error-rate analysis run against the
# platform's ClusterAnalysisTemplates. With a database, canary needs
# migrations.enabled: two versions share the schema for the whole release.
release:
  strategy: rolling          # rolling | canary | bluegreen (not supported yet)
  preset: safe               # safe | fast | demo | manual
  # cookie pins each user to the version that served them first, so nobody
  # flips between versions mid-session. Both versions must set the cookie:
  # with a canary-only cookie, stable users are re-rolled on every request.
  stickiness: cookie         # none | cookie
  smoke:
    path: /healthz           # GET against the canary Service before any traffic, expects 2xx
  analysis:
    errorRateMax: 1          # percent of canary requests in error
    minRequests: 50          # fewer requests in the window is inconclusive, not a pass
  allowForce: true

