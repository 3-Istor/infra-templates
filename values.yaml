# =============================================================================
# GENERIC HELM CHART VALUES
# Ce fichier contient toutes les valeurs par défaut pour le chart générique
# =============================================================================

# -----------------------------------------------------------------------------
# Application Configuration
# -----------------------------------------------------------------------------
nameOverride: ""
fullnameOverride: ""
namespace: dev-sandbox

# Nombre de réplicas (peut être overridé par HPA)
replicaCount: 1

# Vault Secrets Operator Configuration
secrets:
  enabled: false
  vaultPath: "" # e.g., "kvv2/projects/my-project/my-app"

# -----------------------------------------------------------------------------
# Image Configuration
# -----------------------------------------------------------------------------
image:
  repository: ghcr.io/3-istor/template-app-webapp-python-fastapi-react/backend
  pullPolicy: IfNotPresent
  tag: "latest"

imagePullSecrets:
  - name: app-registry

# -----------------------------------------------------------------------------
# Pod Annotations et Labels
# -----------------------------------------------------------------------------
podAnnotations: {}
# prometheus.io/scrape: "true"
# prometheus.io/port: "8080"

podLabels: {}
# team: backend
# component: api

podSecurityContext: {}
# fsGroup: 2000

securityContext: {}
# capabilities:
#   drop:
#   - ALL
# readOnlyRootFilesystem: true
# runAsNonRoot: true
# runAsUser: 1000

# -----------------------------------------------------------------------------
# Service Configuration
# -----------------------------------------------------------------------------
service:
  enabled: true
  type: ClusterIP
  # Ports multiples supportés
  ports:
    - name: http
      port: 8000
      targetPort: 8080
      protocol: TCP
  # - name: metrics
  #   port: 9090
  #   targetPort: 9090
  #   protocol: TCP
  annotations: {}
  # cloud.google.com/load-balancer-type: "Internal"

# -----------------------------------------------------------------------------
# Resources (Requests & Limits)
# -----------------------------------------------------------------------------
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

# -----------------------------------------------------------------------------
# Node Scheduling
# -----------------------------------------------------------------------------
nodeSelector: {}
# node-type: application

tolerations: []
# - key: "dedicated"
#   operator: "Equal"
#   value: "app"
#   effect: "NoSchedule"

affinity: {}
# podAntiAffinity:
#   preferredDuringSchedulingIgnoredDuringExecution:
#   - weight: 100
#     podAffinityTerm:
#       labelSelector:
#         matchExpressions:
#         - key: app.kubernetes.io/name
#           operator: In
#           values:
#           - myapp
#       topologyKey: kubernetes.io/hostname

# -----------------------------------------------------------------------------
# Probes (Health Checks)
# -----------------------------------------------------------------------------
livenessProbe:
  enabled: true
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

readinessProbe:
  enabled: true
  httpGet:
    path: /ready
    port: http
  initialDelaySeconds: 10
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 3

startupProbe:
  enabled: false
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 0
  periodSeconds: 10
  timeoutSeconds: 3
  failureThreshold: 30

configMap:
  enabled: false
  data: {}

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 80

# -----------------------------------------------------------------------------
# Environment Variables
# -----------------------------------------------------------------------------
env: []
# - name: ENVIRONMENT
#   value: "production"
# - name: LOG_LEVEL
#   value: "info"
# - name: DATABASE_HOST
#   valueFrom:
#     secretKeyRef:
#       name: db-credentials
#       key: host

# Variables depuis ConfigMap
envFrom: []
# - configMapRef:
#     name: app-config
# - secretRef:
#     name: app-secrets

# -----------------------------------------------------------------------------
# Volumes & Volume Mounts
# -----------------------------------------------------------------------------
volumes: []
# - name: config-volume
#   configMap:
#     name: app-config
# - name: secret-volume
#   secret:
#     secretName: app-secret
# - name: persistent-storage
#   persistentVolumeClaim:
#     claimName: app-pvc

volumeMounts: []
# - name: config-volume
#   mountPath: /etc/config
#   readOnly: true
# - name: secret-volume
#   mountPath: /etc/secrets
#   readOnly: true
# - name: persistent-storage
#   mountPath: /data

# -----------------------------------------------------------------------------
# Lifecycle Hooks
# -----------------------------------------------------------------------------
lifecycle: {}
# preStop:
#   exec:
#     command: ["/bin/sh", "-c", "sleep 15"]

# -----------------------------------------------------------------------------
# Additional Labels (appliqués à toutes les ressources)
# -----------------------------------------------------------------------------
commonLabels: {}
# environment: production
# team: platform

# -----------------------------------------------------------------------------
# Additional Annotations (appliquées à toutes les ressources)
# -----------------------------------------------------------------------------
commonAnnotations: {}
# managed-by: terraform
