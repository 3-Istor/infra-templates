# -----------------------------------------------------------------------------
# Additional Labels (appliqués à toutes les ressources)
# -----------------------------------------------------------------------------
commonLabels: {}
# environment: production
# team: platform

# -----------------------------------------------------------------------------
# Additional Annotations (appliquées à toutes les ressources)
# -----------------------------------------------------------------------------
commonAnnotations: {}
# managed-by: terraform

monitoring:
  enabled: true
  path: "/"

# -----------------------------------------------------------------------------
# Observability (CNP-185, D11)
# -----------------------------------------------------------------------------
# Prometheus metrics served by the app: adds the prometheus.io/scrape, port and
# path pod annotations the platform collector discovers.
metrics:
  enabled: false
  path: /metrics
  # Container port. Empty uses the first service port's targetPort.
  port: ""

# OpenTelemetry traces: sets the standard OTEL_* variables, read by the SDKs.
# service.name is the app name; service.version (APP_VERSION) the image tag or
# digest. Never OTEL_RESOURCE_ATTRIBUTES: the collector derives the project,
# namespace and pod from the connection, and the render fails if env sets it.
tracing:
  enabled: false
  endpoint: http://otelcol-gateway.observability.svc:4317
  # Parent-based: a request that arrives sampled stays sampled.
  sampleRatio: "1.0"
  # Empty uses the app name.
  serviceName: ""

# How long Loki keeps this app's logs: 7d, 14d or 30d (default 14d). A
# project-level logRetention, set on the namespace, wins over this one.
logRetention: ""

offhours:
  enabled: false
  sleepAt: "0 1 * * *"
  wakeAt: "0 7 * * *" 
  timezone: "Europe/Paris"