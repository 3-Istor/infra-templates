# Pod Annotations et Labels
# -----------------------------------------------------------------------------
podAnnotations: {}
# prometheus.io/scrape: "true"
# prometheus.io/port: "8080"

podLabels: {}
# team: backend
# component: api

podSecurityContext: {}
# fsGroup: 2000

securityContext: {}
# capabilities:
#   drop:
#   - ALL
# readOnlyRootFilesystem: true
# runAsNonRoot: true
# runAsUser: 1000

# -----------------------------------------------------------------------------
# Service Configuration
# -----------------------------------------------------------------------------
service:
  enabled: true
  type: ClusterIP
  # Ports multiples supportés
  ports:
    - name: http
      port: 8000
      targetPort: 8080
      protocol: TCP
  # - name: metrics
  #   port: 9090
  #   targetPort: 9090
  #   protocol: TCP
  annotations: {}
  # cloud.google.com/load-balancer-type: "Internal"

# -----------------------------------------------------------------------------
# Resources (Requests & Limits)
# -----------------------------------------------------------------------------
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

# -----------------------------------------------------------------------------
# Node Scheduling
# -----------------------------------------------------------------------------
nodeSelector: {}
# node-type: application

tolerations: []
# - key: "dedicated"
#   operator: "Equal"
#   value: "app"
#   effect: "NoSchedule"

affinity: {}
# podAntiAffinity:
#   preferredDuringSchedulingIgnoredDuringExecution:
#   - weight: 100
#     podAffinityTerm:
#       labelSelector:
#         matchExpressions:
#         - key: app.kubernetes.io/name
#           operator: In
#           values:
#           - myapp
#       topologyKey: kubernetes.io/hostname

# -----------------------------------------------------------------------------
# Probes (Health Checks)
# -----------------------------------------------------------------------------
livenessProbe:
  enabled: true
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

readinessProbe:
  enabled: true
  httpGet:
    path: /ready
    port: http
  initialDelaySeconds: 10
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 3

startupProbe:
  enabled: false
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 0
  periodSeconds: 10
  timeoutSeconds: 3
  failureThreshold: 30

configMap:
  enabled: false
  data: {}

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 80

