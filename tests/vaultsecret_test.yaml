# The VaultSecret's role is the authorization decision: every Vault role binds
# the same operator service account, so the chart must never render a role or
# path the app's values chose outside its own.
suite: vault secret
templates:
  - templates/vaultsecret.yaml
  - templates/registry-secret.yaml
release:
  name: web
  namespace: evil-web
set:
  cnp.project: evil
  cnp.app: web
  cnp.environment: prod
  project_name: evil
  app_name: web
  secrets.enabled: true
tests:
  - it: derives the path and role from the project and app the ApplicationSet set
    template: templates/vaultsecret.yaml
    asserts:
      - equal:
          path: spec.path
          value: project-evil/web
      - equal:
          path: spec.vaultRole
          value: evil-web-role

  - it: accepts the path and role the CMP writes for a prod app
    template: templates/vaultsecret.yaml
    set:
      secrets.vaultPath: project-evil/web
      secrets.vaultRole: evil-web-role
    asserts:
      - equal:
          path: spec.vaultRole
          value: evil-web-role

  - it: accepts a sub-path of the app's own Vault path
    template: templates/vaultsecret.yaml
    set:
      secrets.vaultPath: project-evil/web/extra
    asserts:
      - equal:
          path: spec.path
          value: project-evil/web/extra

  - it: uses the staging role and path in the staging namespace
    template: templates/vaultsecret.yaml
    release:
      namespace: evil-web-stg
    set:
      cnp.environment: staging
    asserts:
      - equal:
          path: spec.path
          value: project-evil/web/staging
      - equal:
          path: spec.vaultRole
          value: evil-web-staging-role

  - it: refuses a platform role named in the app's values
    template: templates/vaultsecret.yaml
    set:
      secrets.vaultRole: vault-secrets-operator-role
    asserts:
      - failedTemplate:
          errorPattern: is not this app's role

  - it: refuses a platform Vault path named in the app's values
    template: templates/vaultsecret.yaml
    set:
      secrets.vaultPath: kvv2/arcl-cmp/credentials
    asserts:
      - failedTemplate:
          errorPattern: outside this app's Vault path

  - it: refuses another project's Vault path
    template: templates/vaultsecret.yaml
    set:
      secrets.vaultPath: project-victim/app
    asserts:
      - failedTemplate:
          errorPattern: outside this app's Vault path

  - it: refuses a sibling app's path that shares the app name as a prefix
    template: templates/vaultsecret.yaml
    set:
      secrets.vaultPath: project-evil/web-admin
    asserts:
      - failedTemplate:
          errorPattern: outside this app's Vault path

  - it: refuses a path that climbs out of the app's Vault path
    template: templates/vaultsecret.yaml
    set:
      secrets.vaultPath: project-evil/web/../../kvv2/arcl-cmp/credentials
    asserts:
      - failedTemplate:
          errorPattern: not a plain path

  - it: refuses to render when project_name in the values names another project
    template: templates/vaultsecret.yaml
    set:
      project_name: victim
    asserts:
      - failedTemplate:
          errorPattern: is not this app's project

  - it: refuses to render in a namespace that is not the app's own
    template: templates/vaultsecret.yaml
    release:
      namespace: victim-web
    asserts:
      - failedTemplate:
          errorPattern: is not "evil-web"

  - it: refuses to render without the project and app set by the ApplicationSet
    template: templates/vaultsecret.yaml
    set:
      cnp.project: ""
    asserts:
      - failedTemplate:
          errorPattern: needs cnp.project
