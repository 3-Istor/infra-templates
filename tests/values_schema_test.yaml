suite: values schema
templates:
  - templates/service.yaml
tests:
  - it: refuses a key the chart does not know
    set:
      replicas: 2
    asserts:
      - failedTemplate:
          errorPattern: "additional properties 'replicas' not allowed"

  - it: refuses an unknown key inside a block the CMP edits
    set:
      resources.request.cpu: 100m
    asserts:
      - failedTemplate:
          errorPattern: "at '/resources'"

  - it: accepts the auth and routes blocks app-templates writes
    set:
      auth: {realm: shop, clientId: cnp-shop-api}
      routes: {api: {auth: {enabled: true}}}
      ingress.realm: shop
    asserts:
      - isKind:
          of: Service

  - it: accepts the names of the secrets the app expects
    set:
      secrets.keys: [STRIPE_API_KEY, SMTP_PASSWORD]
    asserts:
      - isKind:
          of: Service

  - it: refuses a secret value written where only its name belongs
    set:
      secrets.keys: ["STRIPE_API_KEY=sk_live_123"]
    asserts:
      - failedTemplate:
          errorPattern: "at '/secrets/keys/0'"

  - it: refuses a service that would bypass the Gateway
    set:
      service.type: LoadBalancer
    asserts:
      - failedTemplate:
          errorPattern: "at '/service/type'"

  - it: refuses more replicas than the namespace quota has pods
    set:
      replicaCount: 11
    asserts:
      - failedTemplate:
          errorPattern: "at '/replicaCount'"

  - it: refuses a cpu request the quota check cannot read
    set:
      resources.requests.cpu: 1 core
    asserts:
      - failedTemplate:
          errorPattern: "at '/resources/requests/cpu'"

  - it: refuses an offhours schedule that is not a cron expression
    set:
      offhours.sleepAt: "at night"
    asserts:
      - failedTemplate:
          errorPattern: "at '/offhours/sleepAt'"

  - it: refuses an env value that is not a string
    set:
      env:
        - name: PORT
          value: 8080
    asserts:
      - failedTemplate:
          errorPattern: "at '/env/0/value'"
