suite: registry secret
templates:
  - templates/registry-secret.yaml
  - templates/vaultsecret.yaml
release:
  name: shop
set:
  secrets.enabled: true
  secrets.vaultPath: project-p/shop
tests:
  - it: renders app-registry by default
    template: templates/registry-secret.yaml
    asserts:
      - equal:
          path: metadata.name
          value: app-registry

  - it: skips app-registry when registrySecret.create is false, keeping the app secret
    set:
      registrySecret.create: false
    asserts:
      - hasDocuments:
          count: 0
        template: templates/registry-secret.yaml
      - hasDocuments:
          count: 1
        template: templates/vaultsecret.yaml

  - it: reads the project's credential with the project's system role for imported apps
    template: templates/registry-secret.yaml
    release:
      namespace: shop-api
    set:
      secrets.enabled: false
      project_name: shop
      registrySecret.scope: project
    asserts:
      - equal:
          path: spec.path
          value: project-shop/system/registry
      - equal:
          path: spec.vaultRole
          value: project-shop-system-role

  - it: refuses the project credential without a project
    template: templates/registry-secret.yaml
    set:
      registrySecret.scope: project
    asserts:
      - failedTemplate:
          errorPattern: needs project_name

  - it: refuses the project credential of another project than the namespace
    template: templates/registry-secret.yaml
    release:
      namespace: attacker-web
    set:
      secrets.enabled: false
      project_name: victim
      registrySecret.scope: project
    asserts:
      - failedTemplate:
          errorPattern: does not own namespace

  - it: keeps the app-scoped credential free of the project check
    template: templates/registry-secret.yaml
    release:
      namespace: attacker-web
    set:
      project_name: victim
    asserts:
      - equal:
          path: spec.path
          value: project-p/shop/registry
