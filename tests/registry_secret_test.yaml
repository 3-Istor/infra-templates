suite: registry secret
templates:
  - templates/registry-secret.yaml
  - templates/vaultsecret.yaml
release:
  name: shop
  namespace: p-shop
set:
  cnp.project: p
  cnp.app: shop
  cnp.environment: prod
  secrets.enabled: true
  secrets.vaultPath: project-p/shop
tests:
  - it: renders app-registry by default
    template: templates/registry-secret.yaml
    asserts:
      - equal:
          path: metadata.name
          value: app-registry

  - it: names the secret after registrySecret.name, so a frontend gets its own
    template: templates/registry-secret.yaml
    set:
      registrySecret.name: app-registry-frontend
    asserts:
      - equal:
          path: metadata.name
          value: app-registry-frontend

  - it: skips app-registry when registrySecret.create is false, keeping the app secret
    set:
      registrySecret.create: false
    asserts:
      - hasDocuments:
          count: 0
        template: templates/registry-secret.yaml
      - hasDocuments:
          count: 1
        template: templates/vaultsecret.yaml

  - it: reads the project's credential with the project's system role for imported apps
    template: templates/registry-secret.yaml
    release:
      namespace: shop-api
    set:
      cnp.project: shop
      cnp.app: api
      secrets.enabled: false
      project_name: shop
      registrySecret.scope: project
    asserts:
      - equal:
          path: spec.path
          value: project-shop/system/registry
      - equal:
          path: spec.vaultRole
          value: project-shop-system-role

  - it: refuses the project credential without the project set by the ApplicationSet
    template: templates/registry-secret.yaml
    set:
      cnp.project: ""
      secrets.enabled: false
      registrySecret.scope: project
    asserts:
      - failedTemplate:
          errorPattern: needs cnp.project

  - it: refuses the project credential when project_name names another project
    template: templates/registry-secret.yaml
    release:
      namespace: attacker-web
    set:
      cnp.project: attacker
      cnp.app: web
      secrets.enabled: false
      project_name: victim
      registrySecret.scope: project
    asserts:
      - failedTemplate:
          errorPattern: is not this app's project

  # foo-bar-x used to pass the prefix check for project foo.
  - it: refuses the project credential in a namespace that only starts with the project name
    template: templates/registry-secret.yaml
    release:
      namespace: foo-bar-x
    set:
      cnp.project: foo
      cnp.app: x
      secrets.enabled: false
      registrySecret.scope: project
    asserts:
      - failedTemplate:
          errorPattern: is not "foo-x"

  - it: reads the app-scoped credential under the app's own path with the app's role
    template: templates/registry-secret.yaml
    asserts:
      - equal:
          path: spec.path
          value: project-p/shop/registry
      - equal:
          path: spec.vaultRole
          value: p-shop-role

  - it: uses the staging role and path in the staging namespace
    template: templates/registry-secret.yaml
    release:
      namespace: p-shop-stg
    set:
      cnp.environment: staging
      secrets.vaultPath: project-p/shop/staging
      secrets.vaultRole: p-shop-staging-role
    asserts:
      - equal:
          path: spec.path
          value: project-p/shop/staging/registry
      - equal:
          path: spec.vaultRole
          value: p-shop-staging-role
