# Expected values of an imported service, as the CMP writes them to
# cnp-projects apps/<project>/<app>/values.yaml. The project_name, app_name,
# fullnameOverride, links, ingress and pull secret lines at the bottom are what
# the cnp-apps ApplicationSet adds; they are here so the file renders alone.
image:
  repository: ghcr.io/3-istor/imports/epitweet/user-service
  digest: sha256:32ca39e021b327dcd74b283f131d72b3a7900b805aa1c77a277b88d7e5adf220

service:
  ports:
    - name: http
      port: 8080
      targetPort: 8080

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

monitoring:
  enabled: true
  path: /q/health

env:
  - name: QUARKUS_MONGODB_CONNECTION_STRING
    value: mongodb://mongodb:27017

workload:
  probes:
    liveness: {httpGet: {path: /q/health/live, port: 8080}, initialDelaySeconds: 10}
    readiness: {httpGet: {path: /q/health/ready, port: 8080}}
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 185
    seccompProfile: {type: RuntimeDefault}
  securityContext:
    allowPrivilegeEscalation: false
    capabilities: {drop: [ALL]}
  tmpDirs: [/tmp]

# Added by the ApplicationSet.
project_name: epitweet
app_name: user-service
fullnameOverride: user-service
links:
  - {alias: mongodb, app: mongodb, port: 27017}
  - {alias: social-graph-service, app: social-graph-service, port: 8084}
ingress:
  enabled: false
registrySecret:
  scope: project
