suite: sso
templates:
  - templates/securitypolicy.yaml
set:
  fullnameOverride: web
  project_name: shop
  app_name: web
  ingress.enabled: true
  ingress.hostname: web.example.com
  ingress.sso_protected: true
tests:
  - it: names the token cookies itself, so a project move overwrites them instead of adding new ones
    asserts:
      - equal:
          path: spec.oidc.cookieNames.accessToken
          value: AccessToken
      - equal:
          path: spec.oidc.cookieNames.idToken
          value: IdToken

  - it: forwards the access token without allowed groups
    asserts:
      - equal:
          path: spec.oidc.forwardAccessToken
          value: true
      - notExists:
          path: spec.jwt
      - notExists:
          path: spec.authorization

  - it: keeps the group check with allowed groups
    set:
      ingress.allowedGroups: [project-members]
    asserts:
      - equal:
          path: spec.oidc.forwardAccessToken
          value: true
      - equal:
          path: spec.authorization.defaultAction
          value: Deny

  - it: ends the Keycloak session on logout
    set:
      ingress.realm: shop-staging
    asserts:
      - equal:
          path: spec.oidc.logoutPath
          value: /logout
      - equal:
          path: spec.oidc.provider.endSessionEndpoint
          value: https://auth.3istor.com/realms/shop-staging/protocol/openid-connect/logout

  - it: ends the session at a project's own Keycloak
    set:
      ingress.oidc.issuer: https://auth-shop.3istor.com/realms/shop
    asserts:
      - equal:
          path: spec.oidc.provider.endSessionEndpoint
          value: https://auth-shop.3istor.com/realms/shop/protocol/openid-connect/logout
