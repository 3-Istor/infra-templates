name: Chart guardrails

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    name: Lint and validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1

      - name: helm lint
        run: |
          helm lint .
          helm lint . -f tests/canary-values.yaml --namespace sandbox-demo-app
          helm lint . -f tests/imported-service.yaml --namespace epitweet-user-service
          for values in tests/backing/*.yaml; do
            helm lint . -f "$values" --namespace p-x --set project_name=p,app_name=x,fullnameOverride=x,cnp.project=p,cnp.app=x,cnp.environment=prod
          done

      - name: helm unittest
        run: |
          # Helm 4 refuses unsigned plugins without --verify=false, Helm 3 does not know the flag.
          helm plugin install https://github.com/helm-unittest/helm-unittest.git --version v1.2.1 --verify=false \
            || helm plugin install https://github.com/helm-unittest/helm-unittest.git --version v1.2.1
          helm unittest .

      - name: Install kubeconform
        run: |
          curl -sSLo /tmp/kubeconform.tar.gz \
            https://github.com/yannh/kubeconform/releases/download/v0.7.0/kubeconform-linux-amd64.tar.gz
          tar -xzf /tmp/kubeconform.tar.gz -C /tmp
          sudo mv /tmp/kubeconform /usr/local/bin/

      - name: helm template into kubeconform
        run: |
          helm template canary . -f tests/canary-values.yaml --namespace sandbox-demo-app \
            | kubeconform -strict -summary -ignore-missing-schemas
          helm template user-service . -f tests/imported-service.yaml --namespace epitweet-user-service \
            | kubeconform -strict -summary -ignore-missing-schemas
          for values in tests/backing/*.yaml; do
            helm template backing . -f "$values" --namespace p-x --set project_name=p,app_name=x,fullnameOverride=x,cnp.project=p,cnp.app=x,cnp.environment=prod \
              | kubeconform -strict -summary -ignore-missing-schemas
          done

  rendered-diff:
    name: Rendered manifest diff
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0

      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1

      # The shared chart is rendered by every running application. A change that
      # alters the canary's output alters theirs, so the default has to be that
      # it does not — see tests/canary-values.yaml.
      - name: Render base
        run: |
          git worktree add /tmp/base "origin/${{ github.base_ref }}"
          helm template canary /tmp/base -f tests/canary-values.yaml --namespace sandbox-demo-app > /tmp/base-render.yaml

      - name: Render head
        run: helm template canary . -f tests/canary-values.yaml --namespace sandbox-demo-app > /tmp/head-render.yaml

      - name: Diff
        run: |
          if ! diff -u /tmp/base-render.yaml /tmp/head-render.yaml; then
            echo "::error::This change alters the rendered output of an existing application."
            echo "Every new value must default to today's output. If the change is"
            echo "intentional, update tests/canary-values.yaml in this PR and say so."
            exit 1
          fi
          echo "Rendered output unchanged for the canary application."
