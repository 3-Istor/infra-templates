apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "cnp-generic-app.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cnp-generic-app.labels" . | nindent 4 }}
    project: {{ .Values.project_name | quote }}
spec:
  {{- /* Under canary the Rollout owns the pods and scales this Deployment to 0. */}}
  {{- if not (or (and .Values.autoscaling .Values.autoscaling.enabled) (include "cnp-generic-app.isCanary" .)) }}
  replicas: {{ .Values.replicaCount | default 1 }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "cnp-generic-app.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "cnp-generic-app.selectorLabels" . | nindent 8 }}
        tenant: {{ .Values.project_name | quote }}
        {{- with .Values.logRetention }}
        cnp.3istor.com/log-retention: {{ . | quote }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
      - name: {{ .Chart.Name }}
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
        imagePullPolicy: {{ .Values.image.pullPolicy | default "IfNotPresent" }}
        {{- if .Values.service.enabled }}
        ports:
        {{- range .Values.service.ports }}
        - name: {{ .name }}
          containerPort: {{ .targetPort }}
          protocol: {{ .protocol | default "TCP" }}
        {{- end }}
        {{- end }}
        {{- include "cnp-generic-app.containerEnv" . | trim | nindent 8 }}
        {{- /*
          Only under canary: the probe values in values.yaml were never rendered,
          and turning them on for every app would fail apps that do not serve
          /ready. A canary needs it, or its pods take traffic before the app is up.
        */}}
        {{- if eq (include "cnp-generic-app.releaseStrategy" .) "canary" }}
        readinessProbe:
          httpGet:
            path: {{ .Values.release.smoke.path | default "/healthz" }}
            port: {{ (first .Values.service.ports).targetPort }}
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        {{- end }}
        {{- with .Values.resources }}
        resources:
          {{- toYaml . | nindent 10 }}
        {{- end }}