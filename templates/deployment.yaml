apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "cnp-generic-app.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cnp-generic-app.labels" . | nindent 4 }}
    project: {{ .Values.project_name | quote }}
spec:
  {{- if not (and .Values.autoscaling .Values.autoscaling.enabled) }}
  replicas: {{ .Values.replicaCount | default 1 }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "cnp-generic-app.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "cnp-generic-app.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
      - name: {{ .Chart.Name }}
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
        imagePullPolicy: {{ .Values.image.pullPolicy | default "IfNotPresent" }}
        {{- if .Values.service.enabled }}
        ports:
        {{- range .Values.service.ports }}
        - name: {{ .name }}
          containerPort: {{ .targetPort }}
          protocol: {{ .protocol | default "TCP" }}
        {{- end }}
        {{- end }}
        {{- if or .Values.db.enabled .Values.env }}
        env:
          {{- if .Values.db.enabled }}
          - name: DB_TYPE
            value: postgres
          - name: DB_HOST
            value: {{ printf "%s-db-rw" (include "cnp-generic-app.fullname" .) }}
          - name: DB_PORT
            value: "5432"
          - name: DB_NAME
            value: {{ .Values.db.name | default .Values.app_name }}
          - name: DB_USER
            valueFrom:
              secretKeyRef:
                name: {{ include "cnp-generic-app.fullname" . }}-secrets
                key: username
          - name: DB_PASSWORD
            valueFrom:
              secretKeyRef:
                name: {{ include "cnp-generic-app.fullname" . }}-secrets
                key: password
          {{- end }}
          {{- with .Values.env }}
          {{- toYaml . | nindent 10 }}
          {{- end }}
        {{- end }}
        envFrom:
          {{- if .Values.secrets.enabled }}
          - secretRef:
              name: {{ include "cnp-generic-app.fullname" . }}-secrets
          {{- end }}
          {{- with .Values.envFrom }}
            {{- toYaml . | nindent 10 }}
          {{- end }}
        {{- with .Values.resources }}
        resources:
          {{- toYaml . | nindent 10 }}
        {{- end }}