apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "cnp-generic-app.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cnp-generic-app.labels" . | nindent 4 }}
spec:
  {{- if not (and .Values.autoscaling .Values.autoscaling.enabled) }}
  replicas: {{ .Values.replicaCount | default 1 }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "cnp-generic-app.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "cnp-generic-app.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
      - name: {{ .Chart.Name }}
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
        imagePullPolicy: {{ .Values.image.pullPolicy | default "IfNotPresent" }}
        {{- if .Values.service.enabled }}
        ports:
        {{- range .Values.service.ports }}
        - name: {{ .name }}
          containerPort: {{ .targetPort }}
          protocol: {{ .protocol | default "TCP" }}
        {{- end }}
        {{- end }}
        {{- with .Values.env }}
        env:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        envFrom:
          {{- if .Values.secrets.enabled }}
          - secretRef:
              name: {{ include "cnp-generic-app.fullname" . }}-secrets
          {{- end }}
          {{- with .Values.envFrom }}
            {{- toYaml . | nindent 10 }}
          {{- end }}
        {{- with .Values.resources }}
        resources:
          {{- toYaml . | nindent 10 }}
        {{- end }}