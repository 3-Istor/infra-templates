{{- if and .Values.db.enabled .Values.db.backup.enabled }}
{{- $base := include "cnp-generic-app.dbBaseName" . }}
{{- $cluster := include "cnp-generic-app.dbClusterName" . }}
{{- $bucket := printf "cnpg-%s" $base }}
apiVersion: objectbucket.io/v1alpha1
kind: ObjectBucketClaim
metadata:
  name: {{ $base }}-backup
  namespace: {{ .Release.Namespace }}
spec:
  bucketName: {{ $bucket }}
  storageClassName: {{ ternary "ceph-bucket-retain" "ceph-bucket" .Values.db.backup.keepAfterDelete }}
---
apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: {{ $base }}-backup
  namespace: {{ .Release.Namespace }}
spec:
  retentionPolicy: {{ .Values.db.backup.retentionPolicy | quote }}
  configuration:
    destinationPath: "s3://{{ $bucket }}/"
    endpointURL: {{ .Values.db.backup.endpointURL | quote }}
    {{- /* The ObjectBucketClaim's Secret, created by Rook with the bucket. */}}
    s3Credentials:
      accessKeyId:
        name: {{ $base }}-backup
        key: AWS_ACCESS_KEY_ID
      secretAccessKey:
        name: {{ $base }}-backup
        key: AWS_SECRET_ACCESS_KEY
    wal:
      compression: gzip
    data:
      compression: gzip
---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: {{ $base }}-daily
  namespace: {{ .Release.Namespace }}
spec:
  schedule: {{ .Values.db.backup.schedule | quote }}
  backupOwnerReference: self
  cluster:
    name: {{ $cluster }}
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
{{- end }}
