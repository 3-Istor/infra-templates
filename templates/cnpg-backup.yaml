{{- if and .Values.db.enabled .Values.db.backup.enabled }}
{{- $base := include "cnp-generic-app.dbBaseName" . }}
{{- $cluster := include "cnp-generic-app.dbClusterName" . }}
{{- $bucket := printf "cnpg-%s" $base }}
{{- if eq .Values.db.backup.bucket "rook" }}
apiVersion: objectbucket.io/v1alpha1
kind: ObjectBucketClaim
metadata:
  name: {{ $base }}-backup
  namespace: {{ .Release.Namespace }}
  annotations:
    # Before the pre-migration Backup hook (-2), or the sync never reaches wave 0.
    argocd.argoproj.io/sync-wave: "-5"
spec:
  bucketName: {{ $bucket }}
  storageClassName: {{ ternary "ceph-bucket-retain" "ceph-bucket" .Values.db.backup.keepAfterDelete }}
{{- else if eq .Values.db.backup.bucket "vault" }}
{{- /* Fixed path, whatever secrets.vaultPath says: the CMP writes the key there. */}}
{{- $owner := include "cnp-generic-app.owner" (list . "db.backup") | fromJson }}
apiVersion: ricoberger.de/v1alpha1
kind: VaultSecret
metadata:
  name: {{ $base }}-backup
  namespace: {{ .Release.Namespace }}
  annotations:
    # Before the ObjectStore (-4) that reads this Secret.
    argocd.argoproj.io/sync-wave: "-5"
spec:
  path: {{ $owner.vaultPath }}/backup
  vaultRole: {{ $owner.vaultRole }}
  type: Opaque
{{- else }}
{{- fail (printf "db.backup.bucket %q is not one of rook, vault" .Values.db.backup.bucket) }}
{{- end }}
---
apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: {{ $base }}-backup
  namespace: {{ .Release.Namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "-4"
spec:
  retentionPolicy: {{ .Values.db.backup.retentionPolicy | quote }}
  configuration:
    destinationPath: "s3://{{ $bucket }}/"
    endpointURL: {{ .Values.db.backup.endpointURL | quote }}
    {{- /* Secret of the ObjectBucketClaim (rook) or the VaultSecret (vault). */}}
    s3Credentials:
      accessKeyId:
        name: {{ $base }}-backup
        key: AWS_ACCESS_KEY_ID
      secretAccessKey:
        name: {{ $base }}-backup
        key: AWS_SECRET_ACCESS_KEY
    wal:
      compression: gzip
    data:
      compression: gzip
---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  # Per generation: spec.cluster is immutable, a restore needs a new object.
  name: {{ $cluster }}-daily
  namespace: {{ .Release.Namespace }}
spec:
  schedule: {{ .Values.db.backup.schedule | quote }}
  backupOwnerReference: self
  cluster:
    name: {{ $cluster }}
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
{{- end }}
