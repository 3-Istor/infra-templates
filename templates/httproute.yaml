{{- if .Values.ingress.enabled }}
{{- include "cnp-generic-app.checkHostname" . }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "cnp-generic-app.fullname" . }}-route
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cnp-generic-app.labels" . | nindent 4 }}
  annotations:
    {{- if and .Values.monitoring.enabled .Values.project_name }}
    gatus.3istor.com/{{ .Values.project_name }}-enabled: "true"
    {{- /* The path lands in a YAML document inside this annotation: quote
    escapes quotes and newlines, urlquery keeps the query parameter one value
    ("/" stays, a query may carry it unescaped). */}}
    {{- $monitoringPath := .Values.monitoring.path | default "/" }}
    gatus.3istor.com/{{ .Values.project_name }}-endpoint: |
      group: "Applications"
      {{- if .Values.offhours.enabled }}
      url: {{ printf "http://offhours-guard.%s-system.svc.cluster.local:8082/health/%s/%s?port=%v&path=%s" .Values.project_name .Release.Namespace (include "cnp-generic-app.fullname" .) (index .Values.service.ports 0).port ($monitoringPath | urlquery | replace "%2F" "/") | quote }}
      {{- else }}
      url: {{ printf "https://%s%s" .Values.ingress.hostname $monitoringPath | quote }}
      {{- end }}
      conditions:
        - "[STATUS] == 200"
    {{- end }}
spec:
  parentRefs:
    - name: {{ .Values.ingress.gateway.name }}
      namespace: {{ .Values.ingress.gateway.namespace }}
  hostnames:
    - {{ .Values.ingress.hostname | quote }}
  rules:
    {{- if include "cnp-generic-app.isCanary" . }}
    {{- $fullname := include "cnp-generic-app.fullname" . }}
    {{- $port := (index .Values.service.ports 0).port | default 80 }}
    {{- $sticky := include "cnp-generic-app.isSticky" . }}
    {{- /*
      Argo Rollouts only rewrites the weights of the rule holding both the
      stable and the canary backendRef. The cookie rules come first so a pinned
      user never reaches the weighted split again.
    */}}
    {{- if $sticky }}
    {{- range list "canary" "stable" }}
    - matches:
        - headers:
            - type: RegularExpression
              name: cookie
              value: ".*cnp-track={{ . }}.*"
      backendRefs:
        - name: {{ $fullname }}-{{ . }}
          port: {{ $port }}
    {{- end }}
    {{- end }}
    - backendRefs:
        {{- range list (list "stable" 100) (list "canary" 0) }}
        {{- $track := index . 0 }}
        - name: {{ $fullname }}-{{ $track }}
          port: {{ $port }}
          weight: {{ index . 1 }}
          {{- if $sticky }}
          filters:
            - type: ResponseHeaderModifier
              responseHeaderModifier:
                add:
                  - name: Set-Cookie
                    value: "cnp-track={{ $track }}; Path=/; HttpOnly; SameSite=Lax"
          {{- end }}
        {{- end }}
    {{- else }}
    - backendRefs:
        - name: {{ include "cnp-generic-app.fullname" . }}
          port: {{ (index .Values.service.ports 0).port | default 80 }}
    {{- end }}
{{- end }}
