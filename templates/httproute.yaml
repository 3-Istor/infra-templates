{{- if .Values.ingress.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "cnp-generic-app.fullname" . }}-route
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cnp-generic-app.labels" . | nindent 4 }}
  annotations:
    gatus.3istor.com/{{ .Values.project_name }}-enabled: "true"
    gatus.3istor.com/{{ .Values.project_name }}-endpoint: |
      group: "Applications"
      conditions:
        - "[STATUS] == 200"
spec:
  parentRefs:
    - name: shared-gateway
      namespace: gateway-infra
  hostnames:
    - {{ .Values.ingress.hostname | quote }}
  rules:
    - backendRefs:
        - name: {{ include "cnp-generic-app.fullname" . }}
          port: {{ (index .Values.service.ports 0).port | default 80 }}
{{- end }}