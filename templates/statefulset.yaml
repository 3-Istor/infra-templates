{{- if include "cnp-generic-app.isStatefulSet" . }}
{{- $persistence := dig "persistence" dict .Values.workload }}
{{- if include "cnp-generic-app.isCanary" . }}
{{- fail "workload.kind StatefulSet runs one replica on its own volume: it cannot take release.strategy canary" }}
{{- end }}
{{- if and .Values.autoscaling .Values.autoscaling.enabled }}
{{- fail "workload.kind StatefulSet runs one replica: it cannot take autoscaling.enabled" }}
{{- end }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "cnp-generic-app.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cnp-generic-app.labels" . | nindent 4 }}
    project: {{ .Values.project_name | quote }}
spec:
  {{- if not .Values.offhours.enabled }}
  replicas: 1
  {{- end }}
  serviceName: {{ include "cnp-generic-app.fullname" . }}
  {{- /*
    Retain (D17) keeps the PVC when only the StatefulSet goes, e.g. a bad
    registry write followed by an Argo CD prune of this app. It does not
    survive namespace deletion: deleting the namespace deletes its PVCs
    whatever the policy, which is why the namespace itself is protected from
    prune and the CMP deletes it, PVC included, once the user confirms.
  */}}
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  selector:
    matchLabels:
      {{- include "cnp-generic-app.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "cnp-generic-app.selectorLabels" . | nindent 8 }}
        tenant: {{ .Values.project_name | quote }}
        {{- with (include "cnp-generic-app.networkLabels" . | trim) }}
        {{- . | nindent 8 }}
        {{- end }}
      {{- with (include "cnp-generic-app.podAnnotations" . | trim) }}
      annotations:
        {{- . | nindent 8 }}
      {{- end }}
    spec:
      {{- with (include "cnp-generic-app.workloadPod" . | trim) }}
      {{- . | nindent 6 }}
      {{- end }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
      - name: {{ .Chart.Name }}
        image: {{ include "cnp-generic-app.image" . | quote }}
        imagePullPolicy: {{ .Values.image.pullPolicy | default "IfNotPresent" }}
        {{- if .Values.service.enabled }}
        ports:
        {{- range .Values.service.ports }}
        - name: {{ .name }}
          containerPort: {{ .targetPort }}
          protocol: {{ .protocol | default "TCP" }}
        {{- end }}
        {{- end }}
        {{- include "cnp-generic-app.containerEnv" . | trim | nindent 8 }}
        {{- with .Values.resources }}
        resources:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        {{- with (include "cnp-generic-app.workloadContainer" . | trim) }}
        {{- . | nindent 8 }}
        {{- end }}
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes: ["ReadWriteOnce"]
      {{- with $persistence.storageClass }}
      storageClassName: {{ . }}
      {{- end }}
      resources:
        requests:
          storage: {{ $persistence.size | default "1Gi" }}
{{- end }}
