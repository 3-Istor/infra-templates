{{- if and .Values.service.enabled (not (include "cnp-generic-app.aiRuntime" .)) }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "cnp-generic-app.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cnp-generic-app.labels" . | nindent 4 }}
  annotations:
    {{- if and .Values.monitoring.enabled (not .Values.ingress.enabled) .Values.project_name }}
    gatus.3istor.com/{{ .Values.project_name }}-enabled: "true"
    {{- /* The path lands in a YAML document inside this annotation: quote
    escapes quotes and newlines, urlquery keeps the query parameter one value
    ("/" stays, a query may carry it unescaped). */}}
    {{- $monitoringPath := .Values.monitoring.path | default "/" }}
    gatus.3istor.com/{{ .Values.project_name }}-endpoint: |
      {{- /* Prod and staging share resource names; Gatus refuses duplicates. */}}
      {{- if eq (include "cnp-generic-app.environment" .) "staging" }}
      name: {{ printf "%s (staging)" (include "cnp-generic-app.fullname" .) | quote }}
      {{- end }}
      group: "Services Internes"
      {{- if .Values.offhours.enabled }}
      url: {{ printf "http://offhours-guard.%s-system.svc.cluster.local:8082/health/%s/%s?port=%v&path=%s" .Values.project_name .Release.Namespace (include "cnp-generic-app.fullname" .) (index .Values.service.ports 0).port ($monitoringPath | urlquery | replace "%2F" "/") | quote }}
      {{- else }}
      url: {{ printf "http://%s.%s.svc:%v%s" (include "cnp-generic-app.fullname" .) .Release.Namespace (index .Values.service.ports 0).port $monitoringPath | quote }}
      {{- end }}
      conditions:
        - "[STATUS] == 200"
    {{- end }}
    {{- with .Values.service.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  type: {{ .Values.service.type | default "ClusterIP" }}
  ports:
    {{- range .Values.service.ports }}
    - name: {{ .name }}
      port: {{ .port }}
      targetPort: {{ .targetPort }}
      protocol: {{ .protocol | default "TCP" }}
    {{- end }}
  selector:
    {{- include "cnp-generic-app.selectorLabels" . | nindent 4 }}
{{- end }}