{{- if .Values.service.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "cnp-generic-app.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cnp-generic-app.labels" . | nindent 4 }}
  annotations:
    {{- if and .Values.monitoring.enabled (not .Values.ingress.enabled) }}
    gatus.3istor.com/{{ .Values.project_name }}-enabled: "true"
    gatus.3istor.com/{{ .Values.project_name }}-endpoint: |
      group: "Services Internes"
      url: "http://{{ include "cnp-generic-app.fullname" . }}.{{ .Release.Namespace }}.svc:{{ (index .Values.service.ports 0).port }}{{ .Values.monitoring.path | default "/" }}"
      conditions:
        - "[STATUS] == 200"
    {{- end }}
    {{- with .Values.service.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  type: {{ .Values.service.type | default "ClusterIP" }}
  ports:
    {{- range .Values.service.ports }}
    - name: {{ .name }}
      port: {{ .port }}
      targetPort: {{ .targetPort }}
      protocol: {{ .protocol | default "TCP" }}
    {{- end }}
  selector:
    {{- include "cnp-generic-app.selectorLabels" . | nindent 4 }}
{{- end }}