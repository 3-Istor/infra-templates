{{- if and .Values.ingress.enabled .Values.ingress.sso_protected }}
{{- $realm := default "3istor" .Values.ingress.realm }}
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: {{ include "cnp-generic-app.fullname" . }}-security
  namespace: {{ .Release.Namespace }}
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: {{ include "cnp-generic-app.fullname" . }}-route
  oidc:
    provider:
      issuer: "https://auth.3istor.com/realms/{{ $realm }}"
      authorizationEndpoint: "https://auth.3istor.com/realms/{{ $realm }}/protocol/openid-connect/auth"
      tokenEndpoint: "https://auth.3istor.com/realms/{{ $realm }}/protocol/openid-connect/token"
    
    clientID: "cnp-{{ .Values.project_name }}-{{ .Values.app_name }}"
    
    clientSecret:
      name: {{ include "cnp-generic-app.fullname" . }}-secrets
    
    redirectURL: "https://{{ .Values.ingress.hostname }}/oauth2/callback"
    logoutPath: "/logout"
{{- end }}