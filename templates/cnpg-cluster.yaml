{{- if .Values.db.enabled }}
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: {{ include "cnp-generic-app.fullname" . }}-db
  namespace: {{ .Release.Namespace }}
spec:
  instances: {{ .Values.db.instances }}
  bootstrap:
    initdb:
      database: {{ .Values.db.name | default .Values.app_name }}
      owner: app
      secret:
        name: {{ include "cnp-generic-app.fullname" . }}-secrets
  storage:
    size: {{ .Values.db.storage | default "1Gi" }}
    {{- /* local-path exists only on-prem; every other cluster profile supplies its own. */}}
    storageClass: {{ .Values.db.storageClass }}
  {{- if .Values.db.backup.enabled }}
  backup:
    retentionPolicy: {{ .Values.db.backup.retentionPolicy | quote }}
    barmanObjectStore:
      destinationPath: "{{ .Values.db.backup.destinationPath }}"
      {{- with .Values.db.backup.endpointURL }}
      endpointURL: {{ . | quote }}
      {{- end }}
      s3Credentials:
        accessKeyId:
          name: {{ .Values.db.backup.credentialsSecret }}
          key: {{ .Values.db.backup.accessKeyIdKey }}
        secretAccessKey:
          name: {{ .Values.db.backup.credentialsSecret }}
          key: {{ .Values.db.backup.secretAccessKeyKey }}
      wal:
        compression: {{ .Values.db.backup.walCompression }}
  {{- end }}
{{- end }}
