{{- if .Values.db.enabled }}
{{- $restore := .Values.db.restore | default dict }}
{{- if not (gt (int ($restore.generation | default 0)) 0) }}
{{- $restore = false }}
{{- else }}
{{- if not .Values.db.backup.enabled }}
{{- fail "db.restore needs db.backup.enabled: a database is restored from its backups" }}
{{- end }}
{{- $_ := required "db.restore.sourceServer names the cluster whose backups are restored" $restore.sourceServer }}
{{- end }}
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  {{- /*
    CNPG caps cluster names at 50 chars (it derives pod, service and PVC
    names from this one, which then have to fit Kubernetes' own 63-char DNS
    label limit with room for -rw/-ro/-1 suffixes) — confirmed live, the
    admission webhook rejects anything longer outright, so a fullstack app
    with a normal-length project+app name never gets a database at all.
  */}}
  name: {{ include "cnp-generic-app.dbClusterName" . }}
  namespace: {{ .Release.Namespace }}
  annotations:
    {{- /* Healthy before the backup and migration hooks run (see migrations.yaml). */}}
    argocd.argoproj.io/sync-wave: "-3"
spec:
  {{- if or .Values.db.metrics .Values.db.backup.enabled }}
  inheritedMetadata:
    {{- if .Values.db.backup.enabled }}
    labels:
      # The barman plugin in the instance pods ships WAL and base backups to the RGW.
      cnp.3istor.com/egress-rgw: "true"
    {{- end }}
    {{- if .Values.db.metrics }}
    annotations:
      # CNPG exporter port; read by the on-prem annotated-pods scrape and the cloud Alloy.
      prometheus.io/scrape: "true"
      prometheus.io/port: "9187"
    {{- end }}
  {{- end }}
  instances: {{ .Values.db.instances }}
  {{- with .Values.db.imageName }}
  imageName: {{ . }}
  {{- end }}
  bootstrap:
    {{- if $restore }}
    recovery:
      source: origin
      database: {{ .Values.db.name | default .Values.app_name }}
      owner: app
      secret:
        name: {{ include "cnp-generic-app.fullname" . }}-secrets
      {{- /* No recoveryTarget for "latest": CNPG then replays all WAL; targetImmediate would stop at the base backup. */}}
      {{- if $restore.backupID }}
      recoveryTarget:
        backupID: {{ $restore.backupID | quote }}
        {{- if $restore.targetTime }}
        targetTime: {{ $restore.targetTime | quote }}
        {{- else }}
        targetImmediate: true
        {{- end }}
      {{- end }}
    {{- else }}
    initdb:
      database: {{ .Values.db.name | default .Values.app_name }}
      owner: app
      secret:
        name: {{ include "cnp-generic-app.fullname" . }}-secrets
    {{- end }}
  storage:
    size: {{ .Values.db.storage | default "1Gi" }}
    storageClass: {{ .Values.db.storageClass | default (ternary "ceph-rbd" "local-path" (.Capabilities.APIVersions.Has "ceph.rook.io/v1")) }}
  {{- if .Values.db.backup.enabled }}
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: {{ include "cnp-generic-app.dbBaseName" . }}-backup
  {{- end }}
  {{- if $restore }}
  externalClusters:
    - name: origin
      plugin:
        name: barman-cloud.cloudnative-pg.io
        parameters:
          barmanObjectName: {{ include "cnp-generic-app.dbBaseName" . }}-backup
          serverName: {{ $restore.sourceServer }}
  {{- end }}
{{- end }}
