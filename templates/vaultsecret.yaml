#vaultsecret.yaml
{{- if .Values.secrets.enabled }}
apiVersion: ricoberger.de/v1alpha1
kind: VaultSecret
metadata:
  name: {{ include "cnp-generic-app.fullname" . }}-credentials #changement du nom du secret pour cnpg
  namespace: {{ .Release.Namespace }}
spec:
  path: {{ .Values.secrets.vaultPath }}
  vaultRole: {{ .Release.Namespace }}-role
  type: Opaque
{{- end }}