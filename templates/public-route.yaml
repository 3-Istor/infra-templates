{{- if and .Values.ingress.enabled .Values.ingress.publicPaths }}
{{- include "cnp-generic-app.checkHostname" . }}
{{- $fullname := include "cnp-generic-app.fullname" . }}
{{- /*
  The SecurityPolicy targets only <fullname>-route; Gateway API ranks an Exact
  match above the / prefix there, so these paths skip the SSO. Never in the canary split.
*/}}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ $fullname }}-public-route
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cnp-generic-app.labels" . | nindent 4 }}
spec:
  parentRefs:
    - name: {{ .Values.ingress.gateway.name }}
      namespace: {{ .Values.ingress.gateway.namespace }}
  hostnames:
    - {{ .Values.ingress.hostname | quote }}
  rules:
    - matches:
        {{- range .Values.ingress.publicPaths }}
        {{- $path := .path | default "" }}
        {{- $type := .match | default "Exact" }}
        {{- if not (hasPrefix "/" $path) }}
        {{- fail "ingress.publicPaths: path must start with /" }}
        {{- end }}
        {{- if and (eq $type "PathPrefix") (eq $path "/") }}
        {{- fail "ingress.publicPaths: use sso_protected: false instead of exposing / as a prefix" }}
        {{- end }}
        - path:
            type: {{ $type }}
            value: {{ $path | quote }}
          {{- with .method }}
          method: {{ . }}
          {{- end }}
        {{- end }}
      backendRefs:
        - name: {{ $fullname }}{{ if include "cnp-generic-app.isCanary" . }}-stable{{ end }}
          port: {{ (index .Values.service.ports 0).port | default 80 }}
{{- end }}
