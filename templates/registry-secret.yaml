{{- /*
  imagePullSecrets defaults to a secret named "app-registry" (values.yaml),
  but nothing ever created it: project-bootstrap's vault_kv_secret_v2.app_registry
  writes the pull credentials to Vault, and this is the only thing that syncs
  them into the namespace as the dockerconfigjson secret the Deployment expects.

  registrySecret.scope project is for imported apps, which get no per-app
  Terraform and so no per-app Vault role: one GHCR credential per project (D9),
  written by the CMP at project-<project>/system/registry and read with the
  project's system role that project-bootstrap already creates.
*/}}
{{- $projectScope := eq (.Values.registrySecret.scope | default "app") "project" }}
{{- if and (or .Values.secrets.enabled $projectScope) .Values.registrySecret.create }}
{{- $owner := include "cnp-generic-app.owner" (list . (ternary "registrySecret.scope project" "registrySecret" $projectScope)) | fromJson }}
apiVersion: ricoberger.de/v1alpha1
kind: VaultSecret
metadata:
  name: app-registry
  namespace: {{ .Release.Namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "-4"
spec:
  {{- if $projectScope }}
  path: project-{{ $owner.project }}/system/registry
  vaultRole: project-{{ $owner.project }}-system-role
  {{- else }}
  {{- $vault := include "cnp-generic-app.vault" (list . "registrySecret") | fromJson }}
  path: {{ $vault.path }}/registry
  vaultRole: {{ $vault.role }}
  {{- end }}
  type: kubernetes.io/dockerconfigjson
{{- end }}
