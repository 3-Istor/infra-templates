{{- if .Values.network.allowFrom }}
{{- $owner := include "cnp-generic-app.owner" (list . "network.allowFrom") | fromJson }}
{{- $suffix := ternary "-stg" "" (eq $owner.environment "staging") }}
{{- $allowed := list $owner.namespace (printf "%s-system" $owner.project) }}
{{- range .Values.network.allowFrom }}
{{- $allowed = append $allowed (printf "%s-%s%s" $owner.project . $suffix) }}
{{- end }}
{{- /*
  The project's CiliumClusterwideNetworkPolicy (cnp-project-base) allows every
  namespace of the project, and Cilium allow rules only add up: narrowing it
  takes a deny rule, which wins over any allow. Traffic from outside the
  project is left to that policy.
*/}}
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: {{ include "cnp-generic-app.fullname" . }}-allow-from
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cnp-generic-app.labels" . | nindent 4 }}
spec:
  endpointSelector:
    matchLabels:
      {{- include "cnp-generic-app.selectorLabels" . | nindent 6 }}
  ingressDeny:
    - fromEndpoints:
        - matchExpressions:
            - key: k8s:io.cilium.k8s.namespace.labels.cnp.3istor.com/project
              operator: In
              values: [{{ $owner.project | quote }}]
            - key: k8s:io.kubernetes.pod.namespace
              operator: NotIn
              values:
                {{- range $allowed | uniq }}
                - {{ . | quote }}
                {{- end }}
{{- end }}
