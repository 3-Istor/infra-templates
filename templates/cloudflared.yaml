{{- if and .Values.tunnel .Values.tunnel.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "cnp-generic-app.fullname" . }}-tunnel
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cnp-generic-app.labels" . | nindent 4 }}
    component: cloudflared-tunnel
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ include "cnp-generic-app.fullname" . }}-tunnel
  template:
    metadata:
      labels:
        app: {{ include "cnp-generic-app.fullname" . }}-tunnel
    spec:
      containers:
        - name: cloudflared
          image: cloudflare/cloudflared:latest
          args:
            - "tunnel"
            - "--no-autoupdate"
            - "run"
          env:
            - name: TUNNEL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: cloudflare-tunnel-token
                  key: token
          resources:
            requests:
              cpu: "10m"
              memory: "16Mi"
            limits:
              cpu: "50m"
              memory: "32Mi"
{{- end }}